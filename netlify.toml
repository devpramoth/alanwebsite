[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- Redirects -------------------------------------------------------------
# The previous site was a single page. Only two URLs ever existed (/ and
# /index.html), so there is no legacy redirect map beyond this.
# www -> apex is already configured at the Netlify domain level and is left
# untouched; it was verified as a live 301 during the audit.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# --- Headers ---------------------------------------------------------------

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
